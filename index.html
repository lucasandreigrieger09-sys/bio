<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lucasgrieger.com.br — Em manutenção</title>
<meta name="description" content="Site em manutenção. Em breve estaremos de volta.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
    padding: 24px;
  }

  main {
    max-width: 640px;
    animation: fade 1.2s ease-out both;
  }

  h1 {
    font-weight: 700;
    font-size: clamp(1.75rem, 6vw, 3rem);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .rule {
    width: 56px;
    height: 2px;
    background: #fff;
    margin: 28px auto;
    opacity: 0.35;
  }

  p {
    font-weight: 300;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    line-height: 1.7;
    color: #b3b3b3;
  }

  footer {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    font-weight: 500;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #4d4d4d;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>EU ESTOU ALTERANDO</h1>
    <div class="rule"></div>
    <p>Estamos trabalhando em algo novo.<br>Em breve o site será lançado.</p>
  </main>
  <footer>lucasgrieger.com.br</footer>
</body>
</html>
