<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — lucasgrieger.com.br</title>
<meta name="description" content="Página não encontrada. O site está em construção.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  main {
    position: relative;
    max-width: 640px;
    animation: fade 1.2s ease-out both;
  }

  /* 404 como marca d'água, atrás do conteúdo */
  .code {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    font-weight: 700;
    font-size: clamp(8rem, 30vw, 17rem);
    line-height: 1;
    letter-spacing: -0.04em;
    color: #fff;
    opacity: 0.07;
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
  }

  .emoji {
    font-size: clamp(2rem, 7vw, 2.75rem);
    line-height: 1;
    display: block;
    margin-bottom: 20px;
    animation: blink 4s ease-in-out 1.2s infinite;
  }

  h1 {
    font-weight: 700;
    font-size: clamp(1.5rem, 5.5vw, 2.5rem);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }

  .rule {
    width: 56px;
    height: 2px;
    background: #fff;
    margin: 28px auto;
    opacity: 0.35;
  }

  p {
    font-weight: 300;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    line-height: 1.7;
    color: #b3b3b3;
  }

  footer {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    font-weight: 500;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #4d4d4d;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  /* a piscadinha do 👀 */
  @keyframes blink {
    0%, 92%, 100% { transform: none; }
    96%           { transform: scaleY(0.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    main, .emoji { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <span class="emoji" role="img" aria-label="olhos espiando">👀</span>
    <h1>Você chegou cedo demais</h1>
    <div class="rule"></div>
    <p>Ainda não tem nada pra ver por aqui,<br>mas obrigado por espiar.</p>
  </main>
  <footer>lucasgrieger.com.br</footer>
</body>
</html>
